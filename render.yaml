# Render Blueprint for a public READ-ONLY ATHAR demo (https://render.com/docs/blueprint-spec).
# Nothing here is deployed by this file alone: it takes an account, a connected Git repository and a manual "Apply".
# The public URL does not exist until Render creates the service; read it from the Render dashboard and run
#   python scripts/verify_deployment.py https://<the-url-render-shows>
services:
  - type: web
    name: athar
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/ready
    autoDeploy: false
    envVars:
      - key: ATHAR_MODE
        value: demo
      - key: ATHAR_TRUST_PROXY       # Render terminates TLS and appends the client address to X-Forwarded-For
        value: "1"
      - key: ATHAR_DB
        value: /tmp/athar.db         # ephemeral by design: the demo always restarts from the synthetic sample
      - key: ATHAR_ADMIN_TOKEN       # generated by Render; read it in the dashboard only if you need administrator writes
        generateValue: true
      - key: ATHAR_HSTS
        value: "1"
      - key: ATHAR_FORCE_HTTPS
        value: "1"
    # Optional persistence for administrator edits and the audit log (needs a paid instance; the read-only demo does not need it):
    # plan: starter
    # disk:
    #   name: athar-data
    #   mountPath: /data
    #   sizeGB: 1
    # and change ATHAR_DB above to /data/athar.db
