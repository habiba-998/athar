name: ci

# Every push and pull request runs the full gate. Deployment (job "deploy") runs only on main and only if EVERY other job passed.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.lock.txt }
      - run: pip install -r requirements.lock.txt
      - name: Types
        run: python -m mypy app
      - name: Tests with coverage (fails under 95%)
        run: |
          python -m coverage run --source=app -m pytest -q -p no:cacheprovider
          python -m coverage report --fail-under=95
      - name: Dependency advisories (production pins)
        run: |
          pip install pip-audit
          pip-audit -r requirements.prod.txt --no-deps --disable-pip
      - name: Generated documents are current (deterministic scripts)
        run: |
          python ../scripts/meridian_report.py > /dev/null
          python ../scripts/export_scenarios.py > /dev/null
          git diff --exit-code -- ../docs/evaluation/meridian.json ../scenarios

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -b
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Production dependency advisories (high and critical fail the build)
        run: npm audit --omit=dev --audit-level=high
      - name: Development-only advisories (reported, do not ship)
        run: npm audit --audit-level=high
        continue-on-error: true
      - uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: frontend/dist, retention-days: 3 }

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.lock.txt }
      - run: pip install -r backend/requirements.lock.txt
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser tests (desktop, phone and tablet widths; English and Arabic; public demo mode)
        run: npx playwright test
        working-directory: frontend
        env: { ATHAR_PYTHON: python }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: frontend/test-results, retention-days: 5 }

  mutation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.lock.txt }
      - run: pip install -r backend/requirements.lock.txt
      - name: Hand-chosen mutants of the security- and decision-critical code (a surviving or stale mutant fails the build)
        run: python scripts/mutation_check.py
      - name: Sources are back to their committed text
        run: git diff --exit-code -- backend/app

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -f deploy/Dockerfile -t athar:ci .
      - name: Run it as the public demo and verify it from the outside
        run: |
          TOKEN="$(python3 -c 'import secrets; print(secrets.token_urlsafe(32))')"
          docker run -d --name athar -p 8000:8000 -e ATHAR_ADMIN_TOKEN="$TOKEN" athar:ci
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:8000/api/ready && break; sleep 2; done
          test "$(docker exec athar id -u)" != "0"        # not root
          python3 scripts/verify_deployment.py http://127.0.0.1:8000 --allow-insecure-local
          docker rm -f athar
      - name: Assemble the Hugging Face Space, build ITS Dockerfile, run it and verify it from the outside
        run: |
          python3 scripts/make_hf_space.py --out build/hf-space
          docker build -t athar-space:ci build/hf-space
          docker run -d --name athar-space -p 7860:7860 athar-space:ci
          for i in $(seq 1 40); do curl -fs http://127.0.0.1:7860/api/ready && break; sleep 2; done
          test "$(docker exec athar-space id -u)" = "1000"       # Spaces run the container as user 1000
          python3 scripts/verify_deployment.py http://127.0.0.1:7860 --allow-insecure-local
          docker rm -f athar-space

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - name: Build the static site (Python backend bundled for the browser)
        run: npm run build:static
      - name: Serve it with the production headers and verify it from the outside
        run: |
          npm run preview:static &
          for i in $(seq 1 40); do curl -fs -o /dev/null http://127.0.0.1:5185/ && break; sleep 2; done
          python3 ../scripts/verify_deployment.py http://127.0.0.1:5185 --static --allow-insecure-local
      - uses: actions/upload-artifact@v4
        with: { name: dist-static, path: frontend/dist-static, retention-days: 7 }

  # The release gate: this job is the ONLY dependency of deploy, and it lists every check that must be green.
  gate:
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, mutation, image, static]
    steps:
      - run: echo "all required checks passed"

  # Vercel deploys the branch named "release" to production. Only this job can move that branch, and only after the gate passed,
  # so a red check can never reach production. (Pushes to main create preview deployments only.)
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-latest
    environment: production        # add required reviewers to this environment for a manual approval step
    permissions: { contents: write }
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }      # full history: a depth-1 clone cannot prove the push is a fast-forward and is rejected
      - name: Promote this exact, tested commit to the release branch (fast-forward only; never forced)
        run: git push origin "${GITHUB_SHA}:refs/heads/release"
      - name: Verify the public deployment from outside (retries while Vercel builds and starts the new version)
        env: { PUBLIC_URL: "${{ vars.PUBLIC_URL }}" }
        run: |
          if [ -z "$PUBLIC_URL" ]; then echo "::warning::PUBLIC_URL variable not set; skipping external verification"; exit 0; fi
          for i in $(seq 1 12); do
            if python3 scripts/verify_deployment.py "$PUBLIC_URL" --json deployment-report.json; then exit 0; fi
            echo "attempt $i failed; waiting"; sleep 45
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: deployment-report, path: deployment-report.json, if-no-files-found: ignore }

  # Hugging Face Space: pushed only after the gate, only on main, and only when the owner has added the repository secret HF_TOKEN
  # (a Hugging Face access token with write permission) and the variable HF_SPACE (<user>/<space>). The Space repository is a
  # derived build context, so the push is forced; the source of truth stays on GitHub.
  deploy-space:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [gate]
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space
        run: python3 scripts/make_hf_space.py --out build/hf-space
      - name: Push to the Space
        env: { HF_TOKEN: "${{ secrets.HF_TOKEN }}", HF_SPACE: "${{ vars.HF_SPACE }}" }
        run: |
          if [ -z "$HF_TOKEN" ] || [ -z "$HF_SPACE" ]; then
            echo "::warning::HF_TOKEN secret or HF_SPACE variable is not set; nothing was pushed. See docs/DEPLOYMENT.md."
            exit 0
          fi
          cd build/hf-space
          git init -q -b main
          git config user.name "ATHAR CI"; git config user.email "ci@users.noreply.github.com"
          git add -A
          git commit -q -m "ATHAR ${GITHUB_SHA}"
          git push --force "https://${HF_SPACE%%/*}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
          echo "pushed to the Space; the build starts on Hugging Face"
      - name: Verify the public Space from outside (retries while it builds and starts)
        env: { SPACE_URL: "${{ vars.SPACE_URL }}" }
        run: |
          if [ -z "$SPACE_URL" ]; then echo "::warning::SPACE_URL variable not set; skipping external verification"; exit 0; fi
          for i in $(seq 1 20); do
            if python3 scripts/verify_deployment.py "$SPACE_URL" --json space-report.json; then exit 0; fi
            echo "attempt $i failed; waiting"; sleep 60
          done
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: space-report, path: space-report.json, if-no-files-found: ignore }

  # GitHub Pages (no extra account): enabled by this job itself (configure-pages, enablement) unless the repository variable DISABLE_PAGES is "true". The static site uses relative URLs, so the /<repo>/ sub-path works. Pages cannot set
  # response headers, so the CSP/HSTS of the Netlify deployment are NOT available there.
  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DISABLE_PAGES != 'true'
    needs: [gate]
    runs-on: ubuntu-latest
    permissions: { pages: write, id-token: write }
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/configure-pages@v5
        with: { enablement: true }
      - uses: actions/download-artifact@v4
        with: { name: dist-static, path: site }
      - run: rm -f site/_headers
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Check the published site from outside (index, WebAssembly runtime, backend source)
        run: |
          u="${{ steps.deploy.outputs.page_url }}"
          for i in $(seq 1 20); do curl -fsS -o /dev/null "$u" && break; sleep 6; done
          curl -fsS "$u" | grep -q 'id="root"'
          curl -fsSI "${u}pyodide/pyodide.asm.wasm" | head -1
          curl -fsS "${u}pyodide/athar-backend.json" | grep -q '"main.py"'
          echo "published: $u"
